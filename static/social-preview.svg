<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Stress Match</title>
  <desc id="description">Choose the strongest beat, then find the words that match.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d1714"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="128" y="70" width="944" height="490" rx="18" fill="#172621" stroke="#fffaf1" stroke-opacity=".18"/>

  <g transform="translate(170 106)">
    <rect width="58" height="58" rx="10" fill="#fffaf1"/>
    <path d="M0 50h58v8H10A10 10 0 0 1 0 48z" fill="#ff7652"/>
    <circle cx="16" cy="29" r="4" fill="none" stroke="#0d1714" stroke-width="2"/>
    <circle cx="29" cy="29" r="8" fill="#0d1714"/>
    <circle cx="45" cy="29" r="4" fill="none" stroke="#0d1714" stroke-width="2"/>
    <text x="78" y="18" fill="#8bd8e4" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">WORD-STRESS GAME</text>
    <text x="78" y="55" fill="#fffaf1" font-family="Georgia,serif" font-size="45">Stress Match</text>
  </g>

  <text x="170" y="211" fill="#d7dfdb" font-family="Georgia,serif" font-size="21">Choose the strongest beat, then find the words that match.</text>
  <text x="170" y="248" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">CHOOSE A STRESS PATTERN</text>

  <g transform="translate(170 266)">
    <rect width="164" height="125" rx="8" fill="#15241f" stroke="#53635d"/>
    <text x="14" y="25" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1">2 SYLLABLES</text>
    <text x="14" y="61" fill="#fffaf1" font-family="Georgia,serif" font-size="20">collapsed</text>
    <circle cx="18" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <circle cx="34" cy="97" r="8" fill="#d7f45b"/>
    <text x="150" y="101" text-anchor="end" fill="#c2ceca" font-family="Arial,sans-serif" font-size="9">Second syllable</text>
  </g>

  <g transform="translate(343 266)">
    <rect width="164" height="125" rx="8" fill="#101d19" stroke="#fffaf1"/>
    <path d="M8 118h148a8 8 0 0 1-8 7H16a8 8 0 0 1-8-7z" fill="#ff7652"/>
    <text x="14" y="25" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1">2 SYLLABLES</text>
    <text x="14" y="61" fill="#fffaf1" font-family="Georgia,serif" font-size="20">constant</text>
    <circle cx="18" cy="97" r="8" fill="#d7f45b"/>
    <circle cx="36" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <text x="150" y="101" text-anchor="end" fill="#c2ceca" font-family="Arial,sans-serif" font-size="9">First syllable</text>
  </g>

  <g transform="translate(527 266)">
    <rect width="164" height="125" rx="8" fill="#15241f" stroke="#53635d"/>
    <text x="14" y="25" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1">3 SYLLABLES</text>
    <text x="14" y="61" fill="#fffaf1" font-family="Georgia,serif" font-size="20">unresolved</text>
    <circle cx="18" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <circle cx="32" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <circle cx="48" cy="97" r="8" fill="#d7f45b"/>
    <text x="150" y="101" text-anchor="end" fill="#c2ceca" font-family="Arial,sans-serif" font-size="9">Third syllable</text>
  </g>

  <g transform="translate(700 266)">
    <rect width="164" height="125" rx="8" fill="#15241f" stroke="#53635d"/>
    <text x="14" y="25" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1">3 SYLLABLES</text>
    <text x="14" y="61" fill="#fffaf1" font-family="Georgia,serif" font-size="20">convinces</text>
    <circle cx="18" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <circle cx="34" cy="97" r="8" fill="#d7f45b"/>
    <circle cx="52" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <text x="150" y="101" text-anchor="end" fill="#c2ceca" font-family="Arial,sans-serif" font-size="9">Middle syllable</text>
  </g>

  <g transform="translate(873 266)">
    <rect width="164" height="125" rx="8" fill="#15241f" stroke="#53635d"/>
    <text x="14" y="25" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1">3 SYLLABLES</text>
    <text x="14" y="61" fill="#fffaf1" font-family="Georgia,serif" font-size="20">positive</text>
    <circle cx="18" cy="97" r="8" fill="#d7f45b"/>
    <circle cx="36" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <circle cx="50" cy="97" r="4" fill="none" stroke="#fffaf1" stroke-opacity=".7"/>
    <text x="150" y="101" text-anchor="end" fill="#c2ceca" font-family="Arial,sans-serif" font-size="9">First syllable</text>
  </g>

  <text x="170" y="454" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">6 MATCHES  ·  3 MISSES</text>
  <g transform="translate(815 415)">
    <rect width="222" height="58" fill="#ff7652"/>
    <text x="18" y="36" fill="#0d1714" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1.2">START MATCHING</text>
    <text x="204" y="36" text-anchor="end" fill="#0d1714" font-family="Arial,sans-serif" font-size="20" font-weight="700">→</text>
  </g>

  <line x1="170" y1="500" x2="1037" y2="500" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="170" y="526" fill="#a9b8b1" font-family="Arial,sans-serif" font-size="10">Words adapted from the Academic Word List.</text>
</svg>
